{% set name = "pyreadline3" %}
{% set version = "3.5.5" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pyreadline3-{{ version }}.tar.gz
  sha256: e5fbcaff335c0f25c970a791bd3946bd8641891b796451cb715fc60d9805f7e0

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv
  skip: true  # [not win]

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
  host:
    - pip
    - python
    - sphinx
    - setuptools
    - setuptools-git-versioning
    - setuptools-scm
  run:
    - python

test:
  imports:
    - pyreadline3
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://pypi.python.org/pypi/pyreadline3/
  summary: A python implementation of GNU readline.
  license: BSD-3-Clause
  license_file: doc/COPYING

extra:
  recipe-maintainers:
    - tschoonj
